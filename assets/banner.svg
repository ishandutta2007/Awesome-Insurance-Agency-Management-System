<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#4f46e5" stop-opacity=".3"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(180deg)}}@keyframes barGrow{0%{height:10px;y:290px}50%{height:60px;y:240px}}.particle,.pulse-element{transform-origin:center}.pulse-element{animation:pulseGlow 6s infinite ease-in-out}.particle{animation:floatParticle 8s infinite ease-in-out}.flow-line{stroke-dasharray:8 8;animation:dashFlow 3s linear infinite}.pill-text,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:500;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#38bdf8}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><g opacity=".15"><circle cx="200" cy="200" r="300" fill="none" stroke="#