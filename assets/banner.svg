<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes barGrow {
      0% { height: 10px; y: 290px; }
      50% { height: 60px; y: 240px; }
      100% { height: 10px; y: 290px; }
    }
    .pulse-element { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
    .particle { animation: floatParticle 8s infinite ease-in-out; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 8; animation: dashFlow 3s linear infinite; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
    .pill-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative Tech Grid & Dynamic Visual Elements (Background Visuals) -->
  <g opacity="0.15">
    <circle cx="200" cy="200" r="300" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="200" cy="200" r="200" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1000" cy="100" r="250" fill="none" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="950" cy="120" r="140" fill="#4f46e5" opacity="0.25" filter="url(#glow)" class="pulse-element" />
  <circle cx="150" cy="280" r="120" fill="#0ea5e9" opacity="0.2" filter="url(#glow)" class="pulse-element" />

  <!-- Dynamic Wave & Flow Lines in Background -->
  <path d="M -50 320 Q 300 240 600 330 T 1250 280" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" opacity="0.6"/>
  <path d="M -50 340 Q 300 260 600 350 T 1250 300" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Animated Floating Decorative Icons / Cards (Background Right Side) -->
  <g transform="translate(850, 110)">
    <!-- Insurance Shield Symbol -->
    <path d="M 100 20 L 170 50 V 120 C 170 170 100 210 100 210 C 100 210 30 170 30 120 V 50 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" opacity="0.75" class="particle"/>
    <path d="M 85 110 L 98 125 L 125 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Foreground Title and Subtitle Block (Ensured High-Contrast Foreground Layer) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag / Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8" class="pulse-element"/>
      <text x="32" y="21" class="pill-text">INSURANCE AGENT &amp; BROKER TECH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title-text" font-size="44" letter-spacing="-0.5">
      Awesome Insurance Agency
    </text>
    <text x="0" y="215" class="title-text" font-size="44" letter-spacing="-0.5" fill="url(#accentGrad)">
      Management Systems (AMS)
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" class="subtitle-text" font-size="19">
      Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; Agency Operations
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 295)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🏢 Commercial SaaS</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(160, 0)">
        <rect width="155" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🔓 Open-Source AMS</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(330, 0)">
        <rect width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">📊 Policy &amp; Commissions</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(510, 0)">
        <rect width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">⚡ Agent Workflows</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
